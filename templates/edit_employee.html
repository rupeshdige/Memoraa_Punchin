{% extends "base.html" %}
{% block title %}Edit Employee • Memoraa{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header"><i class="bi bi-pencil me-2"></i>Edit Employee — {{ user.emp_id }}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Role</label>
                            <select name="role" class="form-select">
                                <option value="employee" {% if user.role=='employee' %}selected{% endif %}>Employee</option>
                                <option value="manager" {% if user.role=='manager' %}selected{% endif %}>Manager</option>
                                <option value="admin" {% if user.role=='admin' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Assign Manager</label>
                            <select name="manager_id" class="form-select">
                                <option value="">-- None --</option>
                                {% for m in managers %}
                                <option value="{{ m.id }}" {% if user.manager_id == m.id %}selected{% endif %}>{{ m.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Monthly Salary (₹)</label>
                        <input type="number" name="monthly_salary" class="form-control" step="0.01" min="0" value="{{ user.monthly_salary }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password (leave blank to keep current)</label>
                        <input type="text" name="password" class="form-control" placeholder="Enter new password only if changing">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_active" id="active" {% if user.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="active">Active Account</label>
                    </div>
                    <button type="submit" class="btn btn-gold w-100">Update Employee</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
