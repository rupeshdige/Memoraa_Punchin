{% extends "base.html" %}
{% block title %}Regularize Attendance • Memoraa{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header"><i class="bi bi-pencil-square me-2"></i>Request Regularization</div>
            <div class="card-body">
                <p class="text-secondary small">Forgot to punch in/out? Submit a request. Your manager will review and approve.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" required max="{{ today }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Requested Punch In Time</label>
                            <input type="time" name="punch_in" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Requested Punch Out Time</label>
                            <input type="time" name="punch_out" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reason</label>
                        <textarea name="reason" class="form-control" rows="3" required placeholder="Explain why you missed the punch..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-gold w-100"><i class="bi bi-send me-1"></i>Submit Request</button>
                </form>
            </div>
        </div>
        <div class="text-center mt-3">
            <a href="{{ url_for('my_requests') }}" class="btn btn-outline-gold btn-sm">View My Requests</a>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    // Set max date to today
    document.querySelector('input[name="date"]').max = new Date().toISOString().split('T')[0];
</script>
{% endblock %}
