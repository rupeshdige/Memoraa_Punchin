{% extends "base.html" %}
{% block title %}Add Holiday • Memoraa{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card">
            <div class="card-header"><i class="bi bi-calendar-plus me-2"></i>Add Custom Holiday</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Holiday Name</label>
                        <input type="text" name="name" class="form-control" required placeholder="e.g. Diwali, Company Foundation Day">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description (optional)</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-gold w-100">Add Holiday</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
