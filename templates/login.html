{% extends "base.html" %}
{% block title %}Login • Memoraa{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <h1 class="brand-font gold-text display-4 mb-1"><i class="bi bi-camera-reels"></i> MEMORAA</h1>
            <p class="text-secondary">Photography Studio Attendance System</p>
        </div>
        <div class="card p-4">
            <div class="card-body">
                <h4 class="text-center mb-4 gold-text">Sign In</h4>
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-phone me-1"></i> Mobile Number</label>
                        <input type="text" name="mobile" class="form-control form-control-lg" placeholder="Enter mobile number" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label"><i class="bi bi-lock me-1"></i> Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-gold w-100 btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>
                </form>
                <div class="mt-4 text-center text-secondary small">
                    <i class="bi bi-info-circle me-1"></i> Admin login uses registered mobile & password
                </div>
            </div>
        </div>
        <p class="text-center text-secondary mt-3 small">Yellow & Black Theme • Built for Memoraa Team</p>
    </div>
</div>
{% endblock %}
